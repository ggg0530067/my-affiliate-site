<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>彤彤的選物推薦</title>
  <style>
    body {
      font-family: "Helvetica", sans-serif;
      background-color: #f4f4f4;
      margin: 0;
      padding: 20px;
    }
    h1 {
      text-align: center;
      color: #444;
    }
    .tabs {
      display: flex;
      justify-content: center;
      margin-bottom: 20px;
    }
    .tab {
      padding: 10px 20px;
      margin: 0 5px;
      background-color: #fff;
      border: 1px solid #ddd;
      border-radius: 5px;
      cursor: pointer;
      font-size: 16px;
    }
    .tab.active {
      background-color: #ff5a3d;
      color: #fff;
      border-color: #ff5a3d;
    }
    .product-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
      gap: 20px;
    }
    .product {
      background: #fff;
      border-radius: 10px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.1);
      padding: 20px;
      text-align: center;
    }
    .product img {
      max-width: 100%;
      border-radius: 8px;
    }
    .product h2 {
      font-size: 18px;
      margin-top: 10px;
    }
    .product p {
      font-size: 14px;
      color: #666;
    }
    .product .price {
      font-size: 16px;
      color: #ff5a3d;
      font-weight: bold;
      margin-top: 10px;
    }
    .product .rating {
      margin-top: 10px;
      color: #f5c518;
    }
    .product a {
      display: inline-block;
      margin-top: 12px;
      padding: 10px 16px;
      background-color: #ff5a3d;
      color: #fff;
      text-decoration: none;
      border-radius: 6px;
    }
    .product a:hover {
      background-color: #e14a2c;
    }
    footer {
      text-align: center;
      margin-top: 40px;
      font-size: 14px;
      color: #666;
    }
    .hidden {
      display: none;
    }
  </style>
</head>
<body>
  <h1>彤彤的私藏選物</h1>

  <!-- 分類頁籤 -->
  <div class="tabs">
    <div class="tab active" onclick="showCategory('cat-litter')">貓砂</div>
    <div class="tab" onclick="showCategory('toys')">玩具</div>
    <div class="tab" onclick="showCategory('clothes')">衣服</div>
    <div class="tab" onclick="showCategory('cat-beds')">貓窩</div>
    <div class="tab" onclick="showCategory('cleaning')">清潔</div>
  </div>

  <!-- 商品分類頁面 -->
  <div id="cat-litter" class="product-grid">
    <!-- 模擬 10 個商品 -->
    <div class="product">
      <img src="https://via.placeholder.com/300" alt="貓砂商品圖1">
      <h2>貓砂商品 1</h2>
      <p>商品描述 1</p>
      <p class="price">NT$ 299</p>
      <p class="rating">⭐⭐⭐⭐☆ (4.5/5)</p>
      <a href="#" target="_blank">查看商品</a>
    </div>
    <!-- 其餘 9 個商品... -->
  </div>

  <div id="toys" class="product-grid hidden">
    <!-- 模擬 10 個商品 -->
    <div class="product">
      <img src="https://via.placeholder.com/300" alt="玩具商品圖1">
      <h2>玩具商品 1</h2>
      <p>商品描述 1</p>
      <p class="price">NT$ 199</p>
      <p class="rating">⭐⭐⭐⭐⭐ (5/5)</p>
      <a href="#" target="_blank">查看商品</a>
    </div>
    <!-- 其餘 9 個商品... -->
  </div>

  <div id="clothes" class="product-grid hidden">
    <!-- 模擬 10 個商品 -->
    <div class="product">
      <img src="https://via.placeholder.com/300" alt="衣服商品圖1">
      <h2>衣服商品 1</h2>
      <p>商品描述 1</p>
      <p class="price">NT$ 399</p>
      <p class="rating">⭐⭐⭐⭐ (4/5)</p>
      <a href="#" target="_blank">查看商品</a>
    </div>
    <!-- 其餘 9 個商品... -->
  </div>

  <div id="cat-beds" class="product-grid hidden">
    <!-- 模擬 10 個商品 -->
    <div class="product">
      <img src="https://via.placeholder.com/300" alt="貓窩商品圖1">
      <h2>貓窩商品 1</h2>
      <p>商品描述 1</p>
      <p class="price">NT$ 899</p>
      <p class="rating">⭐⭐⭐⭐⭐ (5/5)</p>
      <a href="#" target="_blank">查看商品</a>
    </div>
    <!-- 其餘 9 個商品... -->
  </div>

  <div id="cleaning" class="product-grid hidden">
    <!-- 模擬 10 個商品 -->
    <div class="product">
      <img src="https://via.placeholder.com/300" alt="清潔商品圖1">
      <h2>清潔商品 1</h2>
      <p>商品描述 1</p>
      <p class="price">NT$ 499</p>
      <p class="rating">⭐⭐⭐⭐☆ (4.5/5)</p>
      <a href="#" target="_blank">查看商品</a>
    </div>
    <!-- 其餘 9 個商品... -->
  </div>

  <footer>
    <p>聯絡我們：<a href="mailto:contact@tongtongshop.com">contact@tongtongshop.com</a></p>
    <p>© 2025 彤彤的選物推薦</p>
  </footer>

  <script>
    function showCategory(categoryId) {
      // 隱藏所有分類
      document.querySelectorAll('.product-grid').forEach(grid => {
        grid.classList.add('hidden');
      });

      // 顯示選中的分類
      document.getElementById(categoryId).classList.remove('hidden');

      // 更新頁籤樣式
      document.querySelectorAll('.tab').forEach(tab => {
        tab.classList.remove('active');
      });
      document.querySelector(`.tab[onclick="showCategory('${categoryId}')"]`).classList.add('active');
    }
  </script>
</body>
</html>
